<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Búho Guardián Nocturno | Animación CSS Pura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene-canvas">
    
    <!-- Cielo estrellado y resplandor -->
    <div class="sky">
      <div class="nebula"></div>
      
      <!-- Estrellas titilantes -->
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
      <div class="star star-4"></div>
      <div class="star star-5"></div>
      <div class="star star-6"></div>
      <div class="star star-7"></div>
      <div class="star star-8"></div>
      <div class="star star-9"></div>
      <div class="star star-10"></div>
      <div class="star star-11"></div>
      <div class="star star-12"></div>
      
      <!-- Estrella fugaz -->
      <div class="shooting-star"></div>

      <!-- Luna -->
      <div class="moon-wrapper">
        <div class="moon">
          <div class="crater crater-1"></div>
          <div class="crater crater-2"></div>
          <div class="crater crater-3"></div>
        </div>
      </div>
    </div>

    <!-- Nubes flotantes continuas -->
    <div class="cloud cloud-slow">
      <div class="puff p1"></div>
      <div class="puff p2"></div>
      <div class="puff p3"></div>
    </div>
    <div class="cloud cloud-fast">
      <div class="puff p1"></div>
      <div class="puff p2"></div>
      <div class="puff p3"></div>
    </div>

    <!-- Escenario del Búho -->
    <div class="nature-stage">
      
      <!-- Rama de árbol -->
      <div class="tree-branch">
        <div class="sub-branch b1"></div>
        <div class="sub-branch b2"></div>
        <div class="leaf leaf-1"></div>
        <div class="leaf leaf-2"></div>
        <div class="leaf leaf-3"></div>
      </div>

      <!-- BÚHO ANIMADO EN CSS -->
      <div class="owl-wrapper">
        <div class="owl">
          
          <!-- Penachos / Orejas -->
          <div class="ear ear-left"></div>
          <div class="ear ear-right"></div>

          <!-- Cuerpo y plumaje del pecho -->
          <div class="owl-body">
            <div class="chest-pattern">
              <span class="feather f1"></span>
              <span class="feather f2"></span>
              <span class="feather f3"></span>
              <span class="feather f4"></span>
              <span class="feather f5"></span>
            </div>
          </div>

          <!-- Alas laterales -->
          <div class="wing wing-left"></div>
          <div class="wing wing-right"></div>

          <!-- Cabeza del búho -->
          <div class="owl-head">
            
            <!-- Discos faciales -->
            <div class="face-disc disc-left"></div>
            <div class="face-disc disc-right"></div>

            <!-- Ojos con parpadeo y dilatación pupilar -->
            <div class="eye eye-left">
              <div class="pupil">
                <div class="eye-shine"></div>
              </div>
              <div class="eyelid"></div>
            </div>

            <div class="eye eye-right">
              <div class="pupil">
                <div class="eye-shine"></div>
              </div>
              <div class="eyelid"></div>
            </div>

            <!-- Pico -->
            <div class="beak"></div>
          </div>

          <!-- Garras en la rama -->
          <div class="talon talon-left">
            <span></span><span></span><span></span>
          </div>
          <div class="talon talon-right">
            <span></span><span></span><span></span>
          </div>

        </div>
      </div>

      <!-- Luciérnagas flotantes -->
      <div class="firefly ff-1"></div>
      <div class="firefly ff-2"></div>
      <div class="firefly ff-3"></div>
      <div class="firefly ff-4"></div>
    </div>

    <!-- Tarjeta informativa fija -->
    <aside class="scene-card">
      <span class="scene-badge">PERSONAJE CSS AUTÓNOMO</span>
      <h2 class="scene-title">Búho Guardián Nocturno</h2>
      <p class="scene-desc">Construido 100% con formas CSS: parpadeo orgánico, dilatación de pupilas, cabeceo oscilante y respiración continua sin JavaScript.</p>
    </aside>

  </div>
</body>
</html>
